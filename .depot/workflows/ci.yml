name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kit/go.mod
          cache: false

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Test with race detector
        run: just test-race

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: latest
          workdir: acfs
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  lint:
    name: Lint
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: kit
            dir: kit
            args: --config=../.golangci.yml
          - name: acfs
            dir: acfs
            args: --config=../.golangci.yml
          - name: builds
            dir: builds
            args: --config=../.golangci.yml
          - name: docker
            dir: docker
            args: --config=../.golangci.yml
          - name: docker-convert
            dir: docker/convert
            args: --config=../../.golangci.yml
          - name: tripwire
            dir: tripwire
            args: --config=../.golangci.yml
          - name: sys-cgroup
            dir: sys/cgroup
            args: --config=../../.golangci.yml
          - name: updater
            dir: updater
            args: --config=../.golangci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache: false

      - name: Run Golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ${{ matrix.module.args }} ./...
          working-directory: ${{ matrix.module.dir }}
          only-new-issues: false
